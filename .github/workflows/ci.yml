name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: build
        run: go vet ./...
      - name: test
        run: go test -p 8 ./...
      - name: style IR fresh
        run: go run ./cmd/twind check ./...
      - name: lint
        run: go tool -modfile=tools/go.mod golangci-lint run ./...
      - name: dead code
        shell: bash
        run: |
          dead=$(go tool -modfile=tools/go.mod deadcode ./...)
          if [ -n "$dead" ]; then
            echo "$dead"
            exit 1
          fi
